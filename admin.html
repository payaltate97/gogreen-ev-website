<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Go Green EV - Test Drive Bookings</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <div class="container">

        <h1>Go Green EV</h1>

        <h2>Test Drive Bookings</h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Full Name</th>

                        <th>Mobile</th>

                        <th>Email</th>

                        <th>City</th>

                        <th>EV Model</th>

                        <th>Date</th>

                        <th>Time</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="bookingTableBody">

                    <!-- Bookings will appear here -->

                </tbody>

            </table>

        </div>

    </div>


    <script src="admin.js"></script>
