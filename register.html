<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Go Green EV</title>

    <!-- CONNECT CSS -->
    <link rel="stylesheet" href="RegisterCss.css">

</head>


<body>


    <!-- =========================
         NAVIGATION
         ========================= -->

    <div class="container">

        <div class="home">

            <ul>

                <li>Go Green Ev</li>

                <li>
                    <a href="index.html">Home</a>
                </li>

            </ul>

        </div>


        <div class="list">

            <ul>

                <li>
                    <a href="showroom.html">EV Showroom</a>
                </li>

                <li>
                    Book Test Drive
                </li>

                <li>
                    <a href="login.html">User Login</a>
                </li>

            </ul>

        </div>

    </div>



    <!-- =========================
         REGISTER PAGE
         ========================= -->

    <div class="loginPage">


        <!-- LEFT SIDE -->

        <div class="left">

            <h1 class="loginlabel">
                ⚡ Create Your Account
            </h1>


            <p class="loginlabel">
                Join EV Motors and explore the future of electric mobility.
            </p>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <div class="design">

                    <input
                        class="inputbox"
                        placeholder="Enter your full name"
                        type="text"
                        id="fullname"
                        name="fullname"
                        required>

                </div>


                <br>


                <div class="design">

                    <input
                        class="inputbox"
                        placeholder="Enter your email"
                        type="email"
                        id="email"
                        name="email"
                        required>

                </div>


                <br>


                <div class="design">

                    <input
                        class="inputbox"
                        placeholder="Enter your mobile no"
                        type="tel"
                        id="mobile"
                        name="mobile"
                        required>

                </div>


                <br>


                <div class="design">

                    <input
                        class="inputbox"
                        placeholder="Enter your password"
                        type="password"
                        id="password"
                        name="password"
                        required>

                </div>


                <br>


                <div class="design">

                    <input
                        class="inputbox"
                        placeholder="Enter your password again"
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required>

                </div>


                <br>


                <div class="design">

                    <button
                        type="submit"
                        class="buttonclass">

                        Create Account

                    </button>

                </div>


                <div class="design">

                    <p class="msg">

                        Already Have An Account ?

                        <a
                            class="link"
                            href="login.html">

                            Login Here

                        </a>

                    </p>

                </div>


            </form>

        </div>



        <!-- RIGHT SIDE -->

        <div class="right">

            <img
                class="scooty"
                src="pngtree-electric-scooter-png-image_12613246.png"
                alt="Electric Scooter">

        </div>


    </div>



    <!-- CONNECT JAVASCRIPT -->

    <script src="register.js"></script>

</body>

</html>
